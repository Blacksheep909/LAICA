name: LAICA desktop (macOS and Linux)
# Builds the Electron app for macOS and Linux. Runs on demand and on version tags; on a tag the files are attached to the release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, rid: osx-arm64, name: mac-arm64 }
          - { os: macos-13, rid: osx-x64, name: mac-x64 }
          - { os: ubuntu-22.04, rid: linux-x64, name: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64, name: linux-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v5.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Build the interface
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Stage the interface and the engine
        working-directory: electron
        run: node scripts/prepare.mjs ${{ matrix.rid }}
      - name: Build the app
        working-directory: electron
        run: |
          npm ci --no-audit --no-fund
          npx electron-builder --publish never
      - name: Collect the files
        run: |
          mkdir -p out
          cd electron/dist
          for f in *.dmg *.zip *.AppImage *.deb; do [ -f "$f" ] && cp "$f" "../../out/${f%.*}-${{ matrix.name }}.${f##*.}"; done
          ls -la ../../out
      - uses: actions/upload-artifact@v5.0.0
        with:
          name: LAICA-${{ matrix.name }}
          path: out/*
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2.2.2
        with:
          files: out/*
          fail_on_unmatched_files: false

name: LAICA checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build unsigned test payload
        shell: pwsh
        run: ./Build.ps1 -Development
      - name: Run all checks
        shell: pwsh
        run: ./Test.ps1
      - name: Upload the unsigned installer and zip
        uses: actions/upload-artifact@v4
        with:
          name: laica-windows-unsigned
          path: dist/*
          if-no-files-found: error

  unix:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Interface (types, tests, build)
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm test
          pnpm exec vite build --base ./
          node ../checks/contract.mjs
      - name: Formatting
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet tool restore
          dotnet csharpier check host core checks server
      - name: Engine (.NET 8, unused code is an error)
        run: dotnet build server/LAICA.Server.csproj -c Release -nologo
      - name: Engine checks
        run: dotnet run --project checks/LAICA.Checks.csproj -c Release
      - name: Server smoke test
        run: checks/server-smoke.sh server/bin/Release/net8.0/laica-server.dll frontend/dist
